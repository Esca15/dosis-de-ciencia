name: Automatizar Dosis de Ciencia

on:
  schedule:
    - cron: '0 8 * * 1,3,5'
  
  workflow_dispatch:

jobs:
  generar-infografia:
    runs-on: ubuntu-latest
    
    env:
      CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}
      CONTRASENA_APP: ${{ secrets.CONTRASENA_APP }}
    
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-roboto
        pip install Pillow requests deep-translator

    - name: Ejecutar generador y envío de correo
      run: python main.py
